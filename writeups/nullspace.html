## Description

nullspace (無) is a dreamlike, browser-based 3D experience about impossible space. Built at StormHacks 2026, it turns the idea of 無 — void, nothingness, or neither yes nor no — into a world that has to be understood by moving through it.

## Inspiration

We were inspired by non-Euclidean geometry, impossible architecture, and the feeling of exploring a place that quietly changes its own rules. Instead of explaining those ideas as theory, we wanted players to encounter them directly and learn through experimentation.

## What it does

Players explore a sequence of surreal rooms and spatial puzzles. Portal-like panels connect spaces that should not fit together, while movement can alter scale, gravity, lighting, and the player's reading of the environment. The experience rewards curiosity: progress comes from noticing how the world behaves, then using those rules differently.

## How we built it

The experience was built with React and TypeScript, using Three.js for the real-time 3D world and Vite for the development pipeline. Zustand manages shared experience state, while Tailwind supports the interface surrounding the 3D scenes. Figma and Procreate were used to shape the visual direction before and during implementation.

## Challenges we ran into

The most difficult system was portal traversal. The player, camera, scene objects, gravity, scale, and lighting all needed to transform together without breaking the illusion. We also had to keep every mechanic connected to the non-Euclidean concept instead of letting the project become a collection of unrelated visual effects.

## Accomplishments that we're proud of

We are proud that the spatial transitions feel like part of one cohesive experience. The portals, changes in scale and gravity, restrained interface, and dreamlike art direction all support the same central idea. Building that level of atmosphere in a browser during a hackathon made nullspace one of our favourite projects to work on.

## What we learned

We learned a great deal about real-time 3D graphics in the browser and about translating mathematical ideas into understandable interactions. More importantly, we learned how much iteration a strange idea needs before it becomes intuitive: the best results came from testing, revising, and staying patient when a mechanic did not work the first time.

## What's next for nullspace

Future work would focus on lighting, shadows, performance, accessibility, and support across more devices. We would also like to expand the world with spaces based on spherical and hyperbolic geometry, new impossible structures, more puzzles, and a deeper story connecting the rooms.
