<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>music library</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles/tailwind-prod.css">
  <link rel="stylesheet" href="styles/dot-grid.css">
  <link rel="stylesheet" href="styles/clocks.css">
  <style>
    html { background: #071021; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071021;
      color: #e6eef6;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0;
    }

    .clock-container { display: none !important; }

    .library-main {
      position: relative;
      z-index: 10;
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 150px 0 96px;
    }

    .library-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding-bottom: 24px;
    }

    .library-header h1 {
      margin: 0;
      font-size: clamp(2.7rem, 6vw, 5.2rem);
      font-weight: 400;
      line-height: 0.9;
      text-transform: lowercase;
      letter-spacing: -0.075em;
    }

    .library-header p {
      max-width: 440px;
      margin: 16px 0 0;
      color: rgba(230, 238, 246, 0.58);
      font-size: 13px;
      line-height: 1.5;
    }

    .library-search {
      width: min(280px, 40vw);
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .library-search:focus { border-color: rgba(183, 228, 199, 0.72); }

    .library-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 74px;
    }

    .library-filters { display: flex; flex-wrap: wrap; gap: 5px; }

    .library-filter {
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: rgba(230, 238, 246, 0.52);
      padding: 7px 9px;
      font: inherit;
      font-size: 11px;
      text-transform: lowercase;
      cursor: pointer;
    }

    .library-filter:hover,
    .library-filter.active { background: rgba(255, 255, 255, 0.09); color: #fff; }
    .library-count { color: rgba(230, 238, 246, 0.45); font-size: 11px; white-space: nowrap; }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 38px 22px;
    }

    .release {
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .release-cover {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
    }

    .release-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease;
    }

    .release:hover .release-cover img,
    .release:focus-visible .release-cover img { transform: scale(1.035); filter: saturate(1.08); }

    .release-favorite {
      position: absolute;
      right: 9px;
      top: 9px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(7, 16, 33, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 13px;
    }

    .release-info { padding: 10px 1px 0; }
    .release-title { margin: 0; color: #fff; font-size: 14px; font-weight: 500; line-height: 1.3; }
    .release-artist { margin: 4px 0 0; color: rgba(230, 238, 246, 0.55); font-size: 12px; }
    .release-meta { margin: 7px 0 0; color: rgba(230, 238, 246, 0.38); font-size: 10px; text-transform: lowercase; }
    .release-note { margin: 8px 0 0; color: rgba(230, 238, 246, 0.62); font-size: 11px; line-height: 1.45; }

    .library-empty {
      grid-column: 1 / -1;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 32px 0;
      color: rgba(230, 238, 246, 0.5);
      font-size: 13px;
    }

    .library-footer {
      position: relative;
      z-index: 10;
      padding: 0 20px 28px;
      color: rgba(230, 238, 246, 0.45);
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 900px) {
      .library-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .library-main { width: min(100% - 28px, 1180px); padding-top: 126px; }
      .library-header { grid-template-columns: 1fr; align-items: start; }
      .library-search { width: 100%; }
      .library-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 13px; }
      .library-controls { align-items: flex-start; flex-direction: column; justify-content: center; padding: 16px 0; }
    }
  </style>
</head>

<body>
  <div class="dot-grid-wrapper"></div>
  <script src="scripts/site-header.js"></script>

  <main class="library-main">
    <header class="library-header">
      <div>
        <h1>music library</h1>
        <p>my favourite music, in my bigggg libary...</p>
      </div>
      <input class="library-search" id="library-search" type="search" aria-label="filter releases" />
    </header>

    <div class="library-controls">
      <div class="library-filters" id="library-filters" aria-label="Filter music library">
        <button class="library-filter active" type="button" data-filter="all">all</button>
        <button class="library-filter" type="button" data-filter="album">albums</button>
        <button class="library-filter" type="button" data-filter="ep">eps</button>
        <button class="library-filter" type="button" data-filter="single">singles</button>
        <button class="library-filter" type="button" data-filter="playlist">playlists</button>
        <button class="library-filter" type="button" data-filter="favorite">favorites</button>
      </div>
      <span class="library-count" id="library-count">loading...</span>
    </div>

    <section class="library-grid" id="library-grid" aria-live="polite"></section>
  </main>

  <footer class="library-footer">&copy; <span id="year"></span> joho's studio</footer>

  <script src="scripts/cloudflare-config.js"></script>
  <script src="scripts/content-api.js"></script>
  <script>
    (function () {
      'use strict';
      var grid = document.getElementById('library-grid');
      var count = document.getElementById('library-count');
      var search = document.getElementById('library-search');
      var filters = document.getElementById('library-filters');
      var items = [];
      var activeFilter = 'all';
      document.getElementById('year').textContent = new Date().getFullYear();

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function visibleItems() {
        var query = search.value.trim().toLowerCase();
        return items.filter(function (item) {
          var filterMatch = activeFilter === 'all' ||
            (activeFilter === 'favorite' ? item.favorite : item.format === activeFilter);
          var haystack = [item.title, item.artist, item.album, item.year, item.note].join(' ').toLowerCase();
          return filterMatch && (!query || haystack.indexOf(query) !== -1);
        });
      }

      function render() {
        var visible = visibleItems();
        count.textContent = visible.length + (visible.length === 1 ? ' release' : ' releases');
        if (!visible.length) {
          grid.innerHTML = '<p class="library-empty">nothing is shelved here yet.</p>';
          return;
        }
        grid.innerHTML = visible.map(function (item) {
          var tag = item.link ? 'a' : 'article';
          var linkAttrs = item.link ? ' href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener noreferrer"' : '';
          var cover = item.cover
            ? '<img src="' + escapeHtml(item.cover) + '" alt="' + escapeHtml((item.title || 'release') + ' cover') + '" loading="lazy">'
            : '';
          var meta = [item.format, item.year].filter(Boolean).join(' · ');
          return '<' + tag + ' class="release"' + linkAttrs + '>' +
            '<div class="release-cover">' + cover + (item.favorite ? '<span class="release-favorite" aria-label="favorite">&hearts;</span>' : '') + '</div>' +
            '<div class="release-info"><h2 class="release-title">' + escapeHtml(item.title) + '</h2>' +
            '<p class="release-artist">' + escapeHtml(item.artist) + '</p>' +
            (meta ? '<p class="release-meta">' + escapeHtml(meta) + '</p>' : '') +
            (item.note ? '<p class="release-note">' + escapeHtml(item.note) + '</p>' : '') +
            '</div></' + tag + '>';
        }).join('');
      }

      filters.addEventListener('click', function (event) {
        var button = event.target.closest('[data-filter]');
        if (!button) return;
        activeFilter = button.dataset.filter;
        filters.querySelectorAll('[data-filter]').forEach(function (item) {
          item.classList.toggle('active', item === button);
        });
        render();
      });
      search.addEventListener('input', render);

      window.JOHO_CMS.list('music')
        .then(function (records) {
          items = window.JOHO_CMS.flatten(records);
          render();
        })
        .catch(function () {
          count.textContent = 'offline';
          grid.innerHTML = '<p class="library-empty">the music shelf could not load right now.</p>';
        });
    })();
  </script>
  <script src="scripts/page-transitions.js"></script>
  <script src="scripts/dot-grid.js"></script>
  <script src="scripts/clocks.js"></script>
</body>

</html>
