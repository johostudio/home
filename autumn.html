<!doctype html>
<html lang="en" style="background:#fff;">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>autumn</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="stylesheet" href="styles/tailwind-prod.css">
  <style>
    html,
    body {
      background: #fff;
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .autumn-page-main {
      min-height: 100vh;
      padding: 8rem 1rem 1rem;
    }

    .autumn-page-main.has-gallery {
      padding-bottom: 5rem;
    }

    .autumn-preview {
      width: min(1440px, 100%);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 4px;
      background: #fff;
    }

    .autumn-preview-bar {
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.14);
      font-size: 0.72rem;
      line-height: 1.2;
    }

    .autumn-preview-url {
      min-width: 0;
      overflow: hidden;
      color: rgba(0, 0, 0, 0.48);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .autumn-preview-live::before {
      content: "";
      display: inline-block;
      width: 0.38rem;
      height: 0.38rem;
      margin-right: 0.45rem;
      border-radius: 50%;
      background: #48a868;
      vertical-align: 0.08em;
    }

    .autumn-preview-open {
      flex: 0 0 auto;
      color: #000;
      text-decoration: none;
      transition: opacity 0.18s ease;
    }

    .autumn-preview-open:hover,
    .autumn-preview-open:focus-visible {
      opacity: 0.5;
      outline: none;
    }

    .autumn-preview-frame {
      height: calc(100vh - 11.25rem);
      height: calc(100dvh - 11.25rem);
      min-height: 520px;
      background: #fff;
    }

    .autumn-preview-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff !important;
    }

    .autumn-gallery {
      width: min(1160px, 100%);
      margin: 4rem auto 0;
    }

    .autumn-gallery[hidden] { display: none; }

    .autumn-gallery h1 {
      margin: 0 0 2rem;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.075em;
      text-transform: lowercase;
    }

    .autumn-grid {
      columns: 3 260px;
      column-gap: 1rem;
    }

    .autumn-item {
      display: inline-block;
      width: 100%;
      margin: 0 0 1.5rem;
      color: inherit;
      text-decoration: none;
      break-inside: avoid;
    }

    .autumn-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 3px;
      background: #f0f0f0;
    }

    .autumn-item-title {
      margin: 0.55rem 0 0;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .autumn-item-meta {
      margin: 0.2rem 0 0;
      color: rgba(0, 0, 0, 0.5);
      font-size: 0.68rem;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .autumn-page-main {
        padding: 5rem 0.5rem 0.5rem;
      }

      .autumn-preview-frame {
        height: calc(100vh - 7.9rem);
        height: calc(100dvh - 7.9rem);
        min-height: 500px;
      }

      .autumn-preview-bar {
        padding-inline: 0.7rem;
      }

      .autumn-gallery {
        margin-top: 3rem;
      }
    }
  </style>
</head>

<body>
  <script src="scripts/site-header.js"></script>

  <main class="autumn-page-main" aria-label="Autumn">
    <section class="autumn-preview" aria-label="Live preview of Snoopy's Studio">
      <div class="autumn-preview-bar">
        <span class="autumn-preview-url autumn-preview-live">snoopystudio.framer.website</span>
        <a class="autumn-preview-open" href="https://snoopystudio.framer.website/" target="_blank"
          rel="noopener noreferrer">open site &#8599;</a>
      </div>
      <div class="autumn-preview-frame">
        <iframe src="https://snoopystudio.framer.website/" title="Snoopy's Studio live website preview"
          loading="eager" allow="fullscreen"></iframe>
      </div>
    </section>
    <section class="autumn-gallery" id="autumn-gallery" hidden>
      <h1>autumn</h1>
      <div class="autumn-grid" id="autumn-grid"></div>
    </section>
  </main>

  <script src="scripts/cloudflare-config.js"></script>
  <script src="scripts/content-api.js"></script>
  <script>
    (function () {
      var main = document.querySelector('.autumn-page-main');
      var gallery = document.getElementById('autumn-gallery');
      var grid = document.getElementById('autumn-grid');

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      window.JOHO_CMS.list('autumn')
        .then(function (records) {
          var items = window.JOHO_CMS.flatten(records);
          if (!items.length) return;
          grid.innerHTML = items.map(function (item) {
            var tag = item.href ? 'a' : 'article';
            var attrs = item.href ? ' href="' + escapeHtml(item.href) + '" target="_blank" rel="noopener noreferrer"' : '';
            var meta = [item.date, item.location].filter(Boolean).join(' / ');
            return '<' + tag + ' class="autumn-item"' + attrs + '>' +
              '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.alt || item.title || 'autumn photograph') + '" loading="lazy">' +
              (item.title ? '<h2 class="autumn-item-title">' + escapeHtml(item.title) + '</h2>' : '') +
              (meta ? '<p class="autumn-item-meta">' + escapeHtml(meta) + '</p>' : '') +
              (item.caption ? '<p class="autumn-item-meta">' + escapeHtml(item.caption) + '</p>' : '') +
              '</' + tag + '>';
          }).join('');
          gallery.hidden = false;
          main.classList.add('has-gallery');
        })
        .catch(function () { });
    })();
  </script>
  <script src="scripts/page-transitions.js"></script>
</body>

</html>
