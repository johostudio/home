<!doctype html>
<html lang="en" style="background:#fff;">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>autumn</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="stylesheet" href="styles/tailwind-prod.css">
  <style>
    html,
    body {
      background: #fff;
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .autumn-page-main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem;
    }

    .autumn-page-main.has-gallery {
      display: block;
      padding-top: 9rem;
    }

    .autumn-tba {
      margin: 0;
      color: #000;
      font-size: clamp(1.8rem, 5vw, 4.5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.075em;
      text-transform: lowercase;
      text-decoration: none;
      transition: opacity 0.18s ease;
    }

    .autumn-tba:hover,
    .autumn-tba:focus-visible {
      opacity: 0.58;
      outline: none;
    }

    .autumn-gallery {
      width: min(1160px, 100%);
      margin: 0 auto;
    }

    .autumn-gallery[hidden] { display: none; }

    .autumn-gallery h1 {
      margin: 0 0 2rem;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.075em;
      text-transform: lowercase;
    }

    .autumn-grid {
      columns: 3 260px;
      column-gap: 1rem;
    }

    .autumn-item {
      display: inline-block;
      width: 100%;
      margin: 0 0 1.5rem;
      color: inherit;
      text-decoration: none;
      break-inside: avoid;
    }

    .autumn-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 3px;
      background: #f0f0f0;
    }

    .autumn-item-title {
      margin: 0.55rem 0 0;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .autumn-item-meta {
      margin: 0.2rem 0 0;
      color: rgba(0, 0, 0, 0.5);
      font-size: 0.68rem;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <script src="scripts/site-header.js"></script>

  <main class="autumn-page-main" aria-label="Autumn gallery">
    <a class="autumn-tba" id="autumn-empty" href="https://snoopystudio.framer.website/" target="_blank"
      rel="noopener noreferrer">tba.</a>
    <section class="autumn-gallery" id="autumn-gallery" hidden>
      <h1>autumn</h1>
      <div class="autumn-grid" id="autumn-grid"></div>
    </section>
  </main>

  <script src="scripts/cloudflare-config.js"></script>
  <script src="scripts/content-api.js"></script>
  <script>
    (function () {
      var main = document.querySelector('.autumn-page-main');
      var empty = document.getElementById('autumn-empty');
      var gallery = document.getElementById('autumn-gallery');
      var grid = document.getElementById('autumn-grid');

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      window.JOHO_CMS.list('autumn')
        .then(function (records) {
          var items = window.JOHO_CMS.flatten(records);
          if (!items.length) return;
          grid.innerHTML = items.map(function (item) {
            var tag = item.href ? 'a' : 'article';
            var attrs = item.href ? ' href="' + escapeHtml(item.href) + '" target="_blank" rel="noopener noreferrer"' : '';
            var meta = [item.date, item.location].filter(Boolean).join(' / ');
            return '<' + tag + ' class="autumn-item"' + attrs + '>' +
              '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.alt || item.title || 'autumn photograph') + '" loading="lazy">' +
              (item.title ? '<h2 class="autumn-item-title">' + escapeHtml(item.title) + '</h2>' : '') +
              (meta ? '<p class="autumn-item-meta">' + escapeHtml(meta) + '</p>' : '') +
              (item.caption ? '<p class="autumn-item-meta">' + escapeHtml(item.caption) + '</p>' : '') +
              '</' + tag + '>';
          }).join('');
          empty.hidden = true;
          gallery.hidden = false;
          main.classList.add('has-gallery');
        })
        .catch(function () { });
    })();
  </script>
  <script src="scripts/page-transitions.js"></script>
</body>

</html>
